services:
  backend:
    build:
      context: ./backend
    container_name: the-burgery-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./database:/app/database
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: the-burgery-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped