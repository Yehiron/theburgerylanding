server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html debe revalidarse siempre: es el que referencia el bundle de
    # JS/CSS con hash del build actual. Sin esto, el navegador lo cachea y
    # sigue mostrando la versión anterior del sitio hasta que se fuerza un
    # refresh manual.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los archivos en /assets/ llevan un hash en el nombre (ej. index-Bqaq-Su7.js)
    # que cambia en cada build, así que un mismo nombre de archivo nunca
    # cambia de contenido: se pueden cachear de forma agresiva sin riesgo de
    # servir algo desactualizado.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
